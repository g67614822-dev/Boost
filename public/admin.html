<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - SAMY TELAZA 407</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #6366f1; --accent: #f43f5e; --bg: #0f172a;
  --card: #1e293b; --border: #334155; --text: #f8fafc;
  --success: #10b981; --warning: #f59e0b;
}
* { box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
#admin-auth { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; justify-content: center; padding: 40px; align-items: center; }
.auth-card { background: var(--card); padding: 30px; border-radius: 28px; width: 100%; max-width: 350px; border: 1px solid var(--border); text-align: center; }
.admin-app { max-width: 450px; margin: auto; min-height: 100vh; display: none; padding-bottom: 100px; }
header { padding: 25px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
.stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; }
.stat-card { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); }
.stat-val { display: block; font-size: 1.3rem; font-weight: 800; color: #fff; margin-top: 5px; }
.stat-label { font-size: 0.6rem; opacity: 0.6; text-transform: uppercase; }
.section-title { padding: 0 20px; font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 800; margin-top: 25px; display: flex; align-items: center; gap: 8px; }
.order-list { padding: 15px; }
.order-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 15px; }
.srv-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card); border-radius: 18px; margin-bottom: 10px; border: 1px solid var(--border); }
.status-btn { padding: 6px 12px; border-radius: 8px; border: none; font-size: 0.65rem; font-weight: 800; cursor: pointer; }
.online { background: rgba(16, 185, 129, 0.2); color: var(--success); }
.offline { background: rgba(244, 63, 94, 0.2); color: var(--accent); }
input { width: 100%; padding: 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 14px; color: #fff; margin: 10px 0; }
.btn { border: none; border-radius: 14px; font-weight: 800; cursor: pointer; padding: 16px; width: 100%; }
.btn-primary { background: var(--primary); color: white; }
.btn-success { background: var(--success); color: white; padding: 10px 20px; font-size: 0.8rem; }
.btn-danger { background: rgba(244, 63, 94, 0.1); color: var(--accent); padding: 10px; }
.admin-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 410px; background: rgba(30, 41, 59, 0.95); display: flex; border-radius: 24px; border: 1px solid var(--border); padding: 12px; z-index: 1000; }
.nav-item { flex: 1; text-align: center; font-size: 0.65rem; color: #64748b; cursor: pointer; }
.nav-item.active { color: var(--primary); }
.nav-item i { display: block; font-size: 1.2rem; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="admin-auth">
  <div class="auth-card">
    <div style="font-size: 3.5rem; color: var(--primary); margin-bottom: 20px;"><i class="fas fa-fingerprint"></i></div>
    <h2>ADMIN ACCESS</h2>
    <input type="password" id="pass-code" placeholder="Code d'accès secret">
    <button class="btn btn-primary" onclick="loginAdmin()">HIDITRA ADMIN</button>
  </div>
</div>

<div class="admin-app" id="app">
  <header><div class="admin-title" id="header-title">TABLEAU DE BORD</div></header>

  <div id="pane-dash" class="pane">
    <div class="stats-container">
      <div class="stat-card" style="grid-column: span 2; background: linear-gradient(135deg, var(--primary), #4338ca);">
        <span class="stat-label">Vola maty (Total)</span>
        <span class="stat-val" id="stat-money">0 Ar</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Miandry</span>
        <span class="stat-val" id="stat-pending" style="color: var(--warning);">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Clients</span>
        <span class="stat-val" id="stat-users">0</span>
      </div>
    </div>
    <div class="section-title"><i class="fas fa-bolt"></i> Action ilaina maika</div>
    <div class="order-list" id="urgent-list"></div>
  </div>

  <div id="pane-services" class="pane" style="display:none; padding: 20px;">
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <button id="btn-online" class="btn btn-success" onclick="toggleOnline()">ONLINE</button>
    </div>

    <div class="section-title"><i class="fas fa-toggle-on"></i> Activé / Désactivé Tolotra</div>
    <div id="services-control-list" style="margin-top:15px;"></div>

    <div class="section-title" style="margin-top:40px;"><i class="fas fa-credit-card"></i> Gérer Paiements</div>
    <div id="payments-list"></div>

    <div class="card" style="margin-top:15px;">
      <h4 style="margin-top:0;">Ajouter Numéro</h4>
      <input type="text" id="pay-name" placeholder="Nom">
      <input type="text" id="pay-method" placeholder="Méthode: Mvola, Orange, etc">
      <input type="text" id="pay-number" placeholder="Numéro">
      <button class="btn btn-primary" onclick="addPayment()">AJOUTER</button>
    </div>
  </div>

  <div id="pane-all" class="pane" style="display:none;">
    <div class="section-title"><i class="fas fa-history"></i> Tantara rehetra</div>
    <div class="order-list" id="all-list"></div>
  </div>

  <nav class="admin-nav">
    <div class="nav-item active" onclick="showPane('dash', this)"><i class="fas fa-home"></i>DASH</div>
    <div class="nav-item" onclick="showPane('services', this)"><i class="fas fa-tasks"></i>SOKAJY</div>
    <div class="nav-item" onclick="showPane('all', this)"><i class="fas fa-database"></i>REHETRA</div>
    <div class="nav-item" onclick="location.reload()"><i class="fas fa-power-off"></i>OUT</div>
  </nav>
</div>

<script>
const API = '';
let adminState = {};

async function loginAdmin() {
  const code = document.getElementById('pass-code').value;
  const res = await fetch(`${API}/api/admin/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  });
  const data = await res.json();
  if(data.success) {
    document.getElementById('admin-auth').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    alert("Code diso!");
  }
}

function showPane(pane, el) {
  document.querySelectorAll('.pane').forEach(p => p.style.display = 'none');
  document.getElementById('pane-' + pane).style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('header-title').innerText = pane === 'services'? 'FITANTANANA TOLOTRA' : (pane === 'all'? 'TANTARA REHETRA' : 'TABLEAU DE BORD');
  if(pane === 'services') renderServices(); else loadData();
}

async function loadData() {
  const res = await fetch(`${API}/api/admin/data`);
  const db = await res.json();
  adminState = db.admin;

  const btn = document.getElementById('btn-online');
  btn.textContent = db.admin.online? 'ONLINE' : 'OFFLINE';
  btn.className = db.admin.online? 'btn btn-success' : 'btn btn-danger';

  let stats = { money: 0, pending: 0, users: db.users.length };
  const urgentBox = document.getElementById('urgent-list');
  const allBox = document.getElementById('all-list');
  urgentBox.innerHTML = ''; allBox.innerHTML = '';

  db.users.forEach(user => {
    user.history.forEach(h => {
      if(h.status === 'Pending') stats.pending++;
      if(h.status === 'Confirmed' && h.amount < 0) stats.money += Math.abs(h.amount);

      const cardHtml = `
        <div class="order-card">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-size:0.7rem; background:rgba(99,102,241,0.1); color:var(--primary); padding:5px 12px; border-radius:10px; font-weight:800;">
              ${user.name} (${user.phone})
            </span>
            <b style="color:${h.amount > 0? 'var(--success)' : 'var(--accent)'}">${h.amount > 0? '+' : ''}${h.amount.toLocaleString()} Ar</b>
          </div>
          <div style="margin:15px 0; font-size:0.85rem; line-height:1.6; background:rgba(0,0,0,0.2); padding:12px; border-radius:12px;">
            <b>TYPE:</b> ${h.type} | <b>SERVICE:</b> ${h.service || 'RECHARGE'}<br>
            ${h.ref? `<b>REF:</b> ${h.ref}<br>` : ''}
            ${h.url? `<b>LINK:</b> <small style="word-break:break-all;">${h.url}</small><br>` : ''}
            ${h.qty? `<b>QTY:</b> ${h.qty}` : ''}
          </div>
          <div style="display:flex; gap:10px;">
            ${h.status === 'Pending'?
              `<button class="btn btn-success" onclick="approve('${user.phone}', ${h.id})">APPROUVER</button>` :
              `<button class="btn btn-danger" onclick="deleteH('${user.phone}', ${h.id})"><i class="fas fa-trash"></i></button>`
            }
          </div>
        </div>
      `;
      allBox.innerHTML += cardHtml;
      if(h.status === 'Pending') urgentBox.innerHTML += cardHtml;
    });
  });

  document.getElementById('stat-money').innerText = stats.money.toLocaleString() + " Ar";
  document.getElementById('stat-pending').innerText = stats.pending;
  document.getElementById('stat-users').innerText = stats.users;

  if(!urgentBox.innerHTML) urgentBox.innerHTML = '<p style="text-align:center; opacity:0.3; padding:40px;">Tsy misy baiko miandry.</p>';
}

async function renderServices() {
  const res = await fetch(`${API}/api/admin/data`);
  const db = await res.json();
  const box = document.getElementById('services-control-list');
  box.innerHTML = '';

  ['fb', 'tt'].forEach(cat => {
    box.innerHTML += `<h4 style="color:var(--primary); margin: 20px 0 10px;">${cat.toUpperCase()}</h4>`;
    db.services[cat].forEach((s, idx) => {
      box.innerHTML += `
        <div class="srv-item">
          <span style="font-size:0.85rem; font-weight:600;">${s.n}</span>
          <button class="status-btn ${s.status}" onclick="toggleSrv('${cat}', ${idx})">
            ${s.status.toUpperCase()}
          </button>
        </div>
      `;
    });
  });

  renderPayments(db.admin.payments);
}

function renderPayments(payments) {
  const box = document.getElementById('payments-list');
  box.innerHTML = payments.map((p, i) => `
    <div class="srv-item">
      <div>
        <div style="font-weight:700;">${p.method} - ${p.number}</div>
        <div style="font-size:0.7rem; opacity:0.6;">${p.name}</div>
      </div>
      <button class="btn btn-danger" style="width:auto; padding:8px 12px;" onclick="deletePayment(${i})">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  `).join('');
}

async function toggleSrv(cat, idx) {
  await fetch(`${API}/api/admin/toggle-service`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cat, idx })
  });
  renderServices();
}

async function toggleOnline() {
  await fetch(`${API}/api/admin/toggle-online`, { method: 'POST' });
  loadData();
}

async function addPayment() {
  const name = document.getElementById('pay-name').value;
  const method = document.getElementById('pay-method').value;
  const number = document.getElementById('pay-number').value;
  if(!name ||!method ||!number) return alert('Fenoy daholo');

  await fetch(`${API}/api/admin/add-payment`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, method, number })
  });

  document.getElementById('pay-name').value = '';
  document.getElementById('pay-method').value = '';
  document.getElementById('pay-number').value = '';
  loadData();
}

async function deletePayment(index) {
  if(!confirm('Hofafana?')) return;
  await fetch(`${API}/api/admin/delete-payment`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index })
  });
  loadData();
}

async function approve(phone, orderId) {
  await fetch(`${API}/api/admin/approve`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, orderId })
  });
  loadData();
  alert("Vita!");
}

async function deleteH(phone, orderId) {
  if(confirm("Hofafana ao amin'ny tantara?")) {
    await fetch(`${API}/api/admin/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, orderId })
    });
    loadData();
  }
}
</script>
</body>
</html>
